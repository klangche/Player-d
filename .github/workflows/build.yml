# Reusable: test everything, then build the five images for amd64 and
# arm64. Pushes to GHCR only when `push` is true.
name: Build

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        required: true
      version:
        description: Version baked into the core image
        type: string
        required: true
      tags:
        description: Comma-separated image tags, e.g. "0.2.0,latest"
        type: string
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore core/PlayerD.sln --locked-mode
      - run: dotnet test core/PlayerD.sln --no-restore --nologo -v q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm test --silent
          npm run build --silent

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: core
            context: .
            file: core/Dockerfile
          - service: dante
            context: services/placeholder
            file: services/placeholder/Dockerfile
          - service: spotify
            context: services/placeholder
            file: services/placeholder/Dockerfile
          - service: airplay
            context: services/placeholder
            file: services/placeholder/Dockerfile
          - service: tidal
            context: services/placeholder
            file: services/placeholder/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: tags
        env:
          IMAGE: ghcr.io/klangche/player-d-${{ matrix.service }}
          TAGS: ${{ inputs.tags }}
        run: echo "list=$(echo "$TAGS" | tr ',' '\n' | sed "s|^|$IMAGE:|" | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ inputs.version }}
            SERVICE=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
