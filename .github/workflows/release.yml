# Owner-run release from main: publishes `<version>` and `latest`
# images, tags `v<version>` and creates the GitHub release. The version
# is read from the VERSION file.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases run only from main." >&2
          exit 1
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists. Bump VERSION first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      push: true
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.version }},latest

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          # Notes from pull request titles since the last release, not the last beta.
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes ${previous:+--notes-start-tag "$previous"}
